<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI in Music scoring</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" fill="white"/%3E%3Crect x="3" y="3" width="58" height="58" fill="none" stroke="black" stroke-width="3"/%3E%3Cellipse cx="26" cy="44" rx="9" ry="7" fill="black"/%3E%3Crect x="30" y="18" width="4" height="28" fill="black"/%3E%3Ctext x="12" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="black"%3EA%3C/text%3E%3Ctext x="45" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="black"%3EI%3C/text%3E%3C/svg%3E'>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap");

    :root {
      --bg: #f5f6f7;
      --panel: #ffffff;
      --panel-border: #dcdfe3;
      --text-main: #17181a;
      --text-muted: #666c75;
      --link: #0c63d6;
      --link-hover: #084ba6;
      --chip-bg: #f3f5f8;
      --chip-border: #d6dbe2;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      margin: 0;
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text-main);
      background: var(--bg);
    }

    .lang-switch {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border-radius: 999px;
      border: 1px solid var(--panel-border);
      background: var(--panel);
      box-shadow: 0 6px 14px rgba(10, 18, 32, 0.06);
      margin: 0 0 12px;
    }

    .lang-switch button {
      border: 0;
      background: transparent;
      padding: 6px 12px;
      border-radius: 999px;
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.08em;
      cursor: pointer;
      color: var(--text-muted);
      transition: color 0.2s ease, background 0.2s ease;
    }

    .lang-switch button.is-active {
      color: var(--text-main);
      background: var(--chip-bg);
      border: 1px solid var(--chip-border);
    }

    .app {
      width: 100%;
      max-width: 540px;
      padding: 24px 20px 20px;
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(10, 18, 32, 0.07);
    }

    .page-wrap {
      width: 100%;
      max-width: 540px;
    }

    .readme-text {
      margin: 0 0 18px;
      color: #000000;
      font-size: 14px;
      line-height: 1.5;
    }

    .readme-text p,
    .readme-text ul,
    .readme-text ol,
    .readme-text h1,
    .readme-text h2,
    .readme-text h3,
    .readme-text h4 {
      margin: 0 0 10px;
    }

    .readme-text ul,
    .readme-text ol {
      padding-left: 18px;
    }

    .readme-text code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      background: #eff2f6;
      border-radius: 4px;
      padding: 1px 5px;
    }

    .options {
      margin-bottom: 18px;
      display: grid;
      gap: 8px;
    }

    .option-card {
      padding: 10px 12px;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      background: #ffffff;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .option-card:hover {
      border-color: #c7cdd5;
      box-shadow: 0 4px 10px rgba(10, 18, 32, 0.07);
    }

    .options label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1e1e1e;
    }

    .service-links {
      margin: 6px 0 0 26px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
    }

    .service-links a {
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1.5px;
    }

    .service-links a:hover,
    .service-links a:focus-visible {
      color: var(--link-hover);
    }

    .result {
      text-align: center;
      margin-top: 8px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    #score {
      font-family: "Manrope", "Trebuchet MS", sans-serif;
      font-size: 17px;
      line-height: 1;
      font-weight: 800;
    }

    .image-wrap {
      margin-top: 14px;
      text-align: center;
    }

    .image-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 0;
      box-shadow: 0 6px 14px rgba(10, 18, 32, 0.1);
      background: #ffffff;
    }

    .download-link {
      display: inline-block;
      margin-top: 12px;
      color: var(--link);
      text-decoration: underline;
      text-underline-offset: 2px;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .download-link:hover,
    .download-link:focus-visible {
      color: var(--link-hover);
    }

    .share-bar {
      margin-top: 12px;
      text-align: center;
    }

    .share-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      color: var(--link);
      text-decoration: none;
    }

    .share-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      flex-shrink: 0;
    }

    .share-btn:hover,
    .share-btn:focus-visible {
      color: var(--link-hover);
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .app {
        padding: 18px 14px 16px;
      }

      .options label {
        font-size: 16px;
      }

      .result {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <div class="lang-switch" role="tablist" aria-label="Language switcher">
      <button type="button" class="lang-btn" data-lang="en" role="tab" aria-selected="false">EN</button>
      <button type="button" class="lang-btn" data-lang="ru" role="tab" aria-selected="false">RU</button>
    </div>

    <div class="app">
      <div id="readmeText" class="readme-text"></div>

      <div class="options" id="options"></div>

      <div class="result"><span id="scoreLabel">Score</span>: <span id="score">0</span></div>
      <div class="image-wrap">
        <img id="resultImage" alt="Generated AI score image">
        <a id="downloadBtn" class="download-link" href="#" download hidden>Download image</a>
      </div>
    </div>

    <div class="share-bar">
      <div class="share-buttons">
        <a id="shareTelegram" class="share-btn" target="_blank" rel="noopener noreferrer" aria-label="Share on Telegram" title="Telegram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 4.2c.3-.9-.3-1.4-1.1-1.1L2.9 9.8c-1 .4-1 1 0 1.3l4.5 1.4 1.7 5.2c.2.7.1 1 .9 1 .6 0 .8-.3 1.1-.6l2.2-2.1 4.6 3.4c.8.5 1.4.2 1.6-.7L21.6 4.2zm-12.4 8-.4 4.2-.9-3 8.8-5.6-7.5 4.4z"/></svg>
        </a>
        <a id="shareX" class="share-btn" target="_blank" rel="noopener noreferrer" aria-label="Share on X" title="X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2h3.1l-6.8 7.8L23 22h-6.1l-4.8-6.9L6.1 22H3l7.3-8.4L1 2h6.3l4.3 6.3L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z"/></svg>
        </a>
        <a id="shareFacebook" class="share-btn" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 22v-9h3l.5-3.5h-3.5V7.2c0-1 .3-1.7 1.8-1.7H17V2.3c-.3 0-1.4-.1-2.7-.1-2.6 0-4.3 1.6-4.3 4.6v2.6H7V13h3v9h3.5z"/></svg>
        </a>
        <a id="shareLinkedIn" class="share-btn" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn" title="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 3A1.8 1.8 0 1 0 4.5 6.6 1.8 1.8 0 0 0 4.5 3zM3 8h3v13H3zM9 8h2.9v1.8h.1c.4-.8 1.4-2 3.4-2 3.6 0 4.2 2.2 4.2 5.2V21h-3v-7.1c0-1.7 0-3.9-2.4-3.9s-2.8 1.9-2.8 3.8V21H9z"/></svg>
        </a>
      </div>
    </div>
  </div>

  <script>
    const optionsEl = document.getElementById("options");
    const scoreEl = document.getElementById("score");
    const scoreLabelEl = document.getElementById("scoreLabel");
    const resultImage = document.getElementById("resultImage");
    const downloadBtn = document.getElementById("downloadBtn");
    const readmeTextEl = document.getElementById("readmeText");
    const shareTelegramEl = document.getElementById("shareTelegram");
    const shareXEl = document.getElementById("shareX");
    const shareFacebookEl = document.getElementById("shareFacebook");
    const shareLinkedInEl = document.getElementById("shareLinkedIn");
    const langButtons = Array.from(document.querySelectorAll(".lang-btn"));

    let checkboxes = [];
    let completeSongCheckbox = null;
    let currentScore = 0;
    let currentLang = "en";

    const translations = {
      en: {
        pageTitle: "AI in Music scoring",
        scoreLabel: "Score",
        imageAlt: "Generated AI score image",
        downloadPrefix: "Download",
        loadError: "Failed to load checkboxes.xml",
        completeSongFallback: "Complete song",
        imageText: "AI MUSIC",
        shareTitle: "AI Music Score",
        shareLabels: {
          telegram: "Share on Telegram",
          x: "Share on X",
          facebook: "Share on Facebook",
          linkedin: "Share on LinkedIn",
        },
      },
      ru: {
        pageTitle: "Оценка AI в музыке",
        scoreLabel: "Оценка",
        imageAlt: "Изображение с оценкой AI",
        downloadPrefix: "Скачать",
        loadError: "Не удалось загрузить checkboxes.xml",
        completeSongFallback: "Полный трек",
        imageText: "ИИ МУЗЫКА",
        shareTitle: "Оценка AI в музыке",
        shareLabels: {
          telegram: "Поделиться в Telegram",
          x: "Поделиться в X",
          facebook: "Поделиться в Facebook",
          linkedin: "Поделиться в LinkedIn",
        },
      },
    };

    function getInitialLanguage() {
      const saved = localStorage.getItem("lang");
      if (saved && translations[saved]) return saved;
      const browserLang = navigator.language?.toLowerCase() || "";
      if (browserLang.startsWith("ru")) return "ru";
      return "en";
    }

    function setActiveLangButton(lang) {
      langButtons.forEach((button) => {
        const isActive = button.dataset.lang === lang;
        button.classList.toggle("is-active", isActive);
        button.setAttribute("aria-selected", String(isActive));
      });
    }

    function setStaticTexts() {
      const t = translations[currentLang];
      document.title = t.pageTitle;
      document.documentElement.lang = currentLang;
      scoreLabelEl.textContent = t.scoreLabel;
      resultImage.alt = t.imageAlt;
      shareTelegramEl.setAttribute("aria-label", t.shareLabels.telegram);
      shareXEl.setAttribute("aria-label", t.shareLabels.x);
      shareFacebookEl.setAttribute("aria-label", t.shareLabels.facebook);
      shareLinkedInEl.setAttribute("aria-label", t.shareLabels.linkedin);
      shareTelegramEl.title = "Telegram";
      shareXEl.title = "X";
      shareFacebookEl.title = "Facebook";
      shareLinkedInEl.title = "LinkedIn";
    }

    function setupShareLinks() {
      const pageUrl = window.location.href;
      const title = translations[currentLang].shareTitle;
      const encodedUrl = encodeURIComponent(pageUrl);
      const encodedTitle = encodeURIComponent(title);

      shareTelegramEl.href = `https://t.me/share/url?url=${encodedUrl}&text=${encodedTitle}`;
      shareXEl.href = `https://twitter.com/intent/tweet?url=${encodedUrl}&text=${encodedTitle}`;
      shareFacebookEl.href = `https://www.facebook.com/sharer/sharer.php?u=${encodedUrl}`;
      shareLinkedInEl.href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodedUrl}`;
    }

    function formatScore(value) {
      return Number(value.toFixed(1)).toString();
    }

    function parseLinks(parentNode) {
      const linksNode = Array.from(parentNode.children).find((child) => child.localName === "links");
      if (!linksNode) return [];
      return Array.from(linksNode.children)
        .filter((child) => child.localName === "link")
        .map((linkNode) => {
          const name = linkNode.querySelector("name")?.textContent?.trim() || "";
          const url = linkNode.querySelector("url")?.textContent?.trim() || "";
          return { name, url };
        })
        .filter((link) => link.name && link.url);
    }

    function parseXml(text) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(text, "application/xml");
      if (xmlDoc.querySelector("parsererror")) {
        return { items: [], completeSongLabelText: "", completeSongLinks: [] };
      }

      const itemNodes = Array.from(xmlDoc.querySelectorAll("item"));
      const items = [];
      itemNodes.forEach((node) => {
        const typeNode = node.querySelector("type");
        const typeText = typeNode?.textContent?.trim() || "";
        const coefficientRaw = node.querySelector("coefficient")?.textContent?.trim() || "";
        const coefficient = Number.parseFloat(coefficientRaw.replace(",", "."));
        if (!typeText || Number.isNaN(coefficient)) return;
        items.push({ type: typeText, links: parseLinks(node), coefficient });
      });

      const completeSongLabelNode = xmlDoc.querySelector("completeSongLabel");
      const completeSongLabelText = completeSongLabelNode?.textContent?.trim() || "";
      const rootNode = xmlDoc.querySelector("checkboxes");
      const completeSongLinks = rootNode ? parseLinks(rootNode) : [];

      return { items, completeSongLabelText, completeSongLinks };
    }

    function renderLinksLine(links) {
      if (!links.length) return null;
      const line = document.createElement("div");
      line.className = "service-links";
      links.forEach((link, index) => {
        if (index > 0) line.append(document.createTextNode(", "));
        const anchor = document.createElement("a");
        anchor.href = link.url;
        anchor.target = "_blank";
        anchor.rel = "noopener noreferrer";
        anchor.textContent = link.name;
        line.append(anchor);
      });
      return line;
    }

    function bindCardToggle(card, checkbox) {
      card.addEventListener("click", (event) => {
        const target = event.target;
        if (!(target instanceof Element)) return;
        if (target.closest("a")) return;
        if (target.closest("label")) return;
        if (checkbox.disabled) return;
        checkbox.checked = !checkbox.checked;
        checkbox.dispatchEvent(new Event("change", { bubbles: true }));
      });
    }

    function renderOptions(items, completeSongLabelText, completeSongLinks) {
      optionsEl.innerHTML = "";
      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "option-card";
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "item";
        checkbox.dataset.coefficient = String(item.coefficient);
        checkbox.addEventListener("change", updateScore);
        const typeText = document.createElement("span");
        typeText.textContent = ` ${item.type}`;
        label.append(checkbox, typeText);
        card.append(label);
        bindCardToggle(card, checkbox);
        const linksLine = renderLinksLine(item.links);
        if (linksLine) card.append(linksLine);
        optionsEl.append(card);
      });
      const completeCard = document.createElement("div");
      completeCard.className = "option-card";
      const completeLabel = document.createElement("label");
      const completeCheckbox = document.createElement("input");
      completeCheckbox.type = "checkbox";
      completeCheckbox.className = "item item-complete-song";
      completeCheckbox.dataset.completeSong = "true";
      completeCheckbox.addEventListener("change", updateScore);
      const completeText = document.createElement("span");
      completeText.textContent = ` ${completeSongLabelText || translations[currentLang].completeSongFallback}`;
      completeLabel.append(completeCheckbox, completeText);
      completeCard.append(completeLabel);
      bindCardToggle(completeCard, completeCheckbox);
      const completeLinksLine = renderLinksLine(completeSongLinks);
      if (completeLinksLine) completeCard.append(completeLinksLine);
      optionsEl.append(completeCard);

      checkboxes = Array.from(document.querySelectorAll(".item"));
      completeSongCheckbox = completeCheckbox;
    }

    async function loadOptionsFromXml() {
      try {
        const xmlPath = currentLang === "ru" ? "./checkboxes.ru.xml" : "./checkboxes.xml";
        const response = await fetch(xmlPath);
        if (!response.ok) throw new Error("XML loading failed");
        const xmlText = await response.text();
        const { items, completeSongLabelText, completeSongLinks } = parseXml(xmlText);
        if (items.length === 0) throw new Error("XML format is invalid");
        renderOptions(items, completeSongLabelText, completeSongLinks);
      } catch (error) {
        optionsEl.textContent = translations[currentLang].loadError;
        checkboxes = [];
      }
      updateScore();
    }

    async function loadReadmeText() {
      const candidates = currentLang === "ru"
        ? ["./readme.ru.md", "./README.ru.md", "./readme.md", "./README.md"]
        : ["./readme.md", "./README.md", "./readme.ru.md", "./README.ru.md"];
      for (const filePath of candidates) {
        try {
          const response = await fetch(filePath);
          if (!response.ok) continue;
          const text = (await response.text()).trim();
          if (!text) continue;
          readmeTextEl.innerHTML = markdownToHtml(text);
          return;
        } catch (error) {
          // Try next candidate.
        }
      }
      readmeTextEl.innerHTML = "";
    }

    function escapeHtml(text) {
      return text
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;");
    }

    function formatInlineMd(text) {
      let result = escapeHtml(text);
      result = result.replace(/`([^`]+)`/g, "<code>$1</code>");
      result = result.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
      result = result.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      result = result.replace(/\*([^*]+)\*/g, "<em>$1</em>");
      return result;
    }

    function markdownToHtml(markdown) {
      const lines = markdown.replaceAll("\r\n", "\n").split("\n");
      const html = [];
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) {
          html.push("</ul>");
          inUl = false;
        }
        if (inOl) {
          html.push("</ol>");
          inOl = false;
        }
      };

      lines.forEach((rawLine) => {
        const line = rawLine.trim();
        if (!line) {
          closeLists();
          return;
        }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          closeLists();
          const level = heading[1].length;
          html.push(`<h${level}>${formatInlineMd(heading[2])}</h${level}>`);
          return;
        }

        const ordered = line.match(/^\d+\.\s+(.*)$/);
        if (ordered) {
          if (!inOl) {
            if (inUl) {
              html.push("</ul>");
              inUl = false;
            }
            html.push("<ol>");
            inOl = true;
          }
          html.push(`<li>${formatInlineMd(ordered[1])}</li>`);
          return;
        }

        const unordered = line.match(/^[-*]\s+(.*)$/);
        if (unordered) {
          if (!inUl) {
            if (inOl) {
              html.push("</ol>");
              inOl = false;
            }
            html.push("<ul>");
            inUl = true;
          }
          html.push(`<li>${formatInlineMd(unordered[1])}</li>`);
          return;
        }

        closeLists();
        html.push(`<p>${formatInlineMd(line)}</p>`);
      });

      closeLists();
      return html.join("");
    }

    function updateScore(event) {
      const changedCheckbox = event?.target instanceof HTMLInputElement ? event.target : null;
      if (
        changedCheckbox &&
        completeSongCheckbox &&
        changedCheckbox !== completeSongCheckbox &&
        completeSongCheckbox.checked
      ) {
        completeSongCheckbox.checked = false;
      }

      if (completeSongCheckbox && completeSongCheckbox.checked) {
        let totalScore = 0;
        checkboxes.forEach((checkbox) => {
          if (checkbox === completeSongCheckbox) return;
          checkbox.checked = false;
          const coefficient = Number.parseFloat(checkbox.dataset.coefficient || "0");
          if (Number.isNaN(coefficient)) return;
          totalScore += coefficient;
        });
        currentScore = totalScore;
        scoreEl.textContent = formatScore(currentScore);
        generateImage();
        return;
      }

      let score = 0;
      checkboxes.forEach((checkbox) => {
        if (checkbox === completeSongCheckbox) return;
        if (!checkbox.checked) return;
        const coefficient = Number.parseFloat(checkbox.dataset.coefficient || "0");
        if (Number.isNaN(coefficient)) return;
        score += coefficient;
      });

      currentScore = score;

      scoreEl.textContent = formatScore(currentScore);
      generateImage();
    }

    function generateImage() {
      const text = `${translations[currentLang].imageText} ${formatScore(currentScore)}`;
      const fontSize = 48;
      const fontFamily = '"SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace';
      const borderWidth = 4;
      const paddingX = 18;
      const paddingY = 12;

      // Measure text first to size the canvas around content.
      const measureCanvas = document.createElement("canvas");
      const measureCtx = measureCanvas.getContext("2d");
      measureCtx.font = `800 ${fontSize}px ${fontFamily}`;
      const metrics = measureCtx.measureText(text);
      const ascent = metrics.actualBoundingBoxAscent || Math.floor(fontSize * 0.8);
      const descent = metrics.actualBoundingBoxDescent || Math.floor(fontSize * 0.2);
      const textWidth = Math.ceil(metrics.width);
      const textHeight = ascent + descent;

      const canvas = document.createElement("canvas");
      canvas.width = textWidth + paddingX * 2 + borderWidth * 2;
      canvas.height = textHeight + paddingY * 2 + borderWidth * 2;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = borderWidth;
      ctx.strokeRect(borderWidth / 2, borderWidth / 2, canvas.width - borderWidth, canvas.height - borderWidth);
      ctx.fillStyle = "#000000";
      ctx.font = `800 ${fontSize}px ${fontFamily}`;
      ctx.textAlign = "left";
      ctx.textBaseline = "alphabetic";
      const x = borderWidth + paddingX;
      const y = borderWidth + paddingY + ascent;
      ctx.fillText(text, x, y);

      const imageDataUrl = canvas.toDataURL("image/png");
      resultImage.src = imageDataUrl;
      downloadBtn.href = imageDataUrl;
      downloadBtn.download = `${text}.png`;
      downloadBtn.hidden = false;
      downloadBtn.textContent = `${translations[currentLang].downloadPrefix} ${text}.png`;
    }

    function setLanguage(lang) {
      if (!translations[lang]) return;
      currentLang = lang;
      localStorage.setItem("lang", lang);
      setActiveLangButton(lang);
      setStaticTexts();
      setupShareLinks();
      loadReadmeText();
      loadOptionsFromXml();
      updateScore();
    }

    langButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const lang = button.dataset.lang || "en";
        if (lang === currentLang) return;
        setLanguage(lang);
      });
    });

    setLanguage(getInitialLanguage());
  </script>
</body>
</html>
