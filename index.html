<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI in Music Scoring</title>
  <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" fill="white"/%3E%3Crect x="3" y="3" width="58" height="58" fill="none" stroke="black" stroke-width="3"/%3E%3Cellipse cx="26" cy="44" rx="9" ry="7" fill="black"/%3E%3Crect x="30" y="18" width="4" height="28" fill="black"/%3E%3Ctext x="12" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="black"%3E1%3C/text%3E%3Ctext x="45" y="22" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="black"%3E0%3C/text%3E%3C/svg%3E'>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      line-height: 1.4;
    }

    h1 {
      margin-bottom: 16px;
    }

    .options {
      margin-bottom: 20px;
    }

    .options label {
      display: block;
      margin: 8px 0;
      font-size: 18px;
    }

    .result {
      font-size: 22px;
      font-weight: bold;
    }

    button {
      margin-top: 16px;
      padding: 10px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    .image-wrap {
      margin-top: 20px;
    }

    .image-wrap img {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>AI in Music Scoring</h1>

  <div class="options" id="options"></div>

  <div class="result">Sum (10 - complete AI): <span id="score">0</span></div>
  <button id="generateBtn" type="button">Generate image</button>
  <div class="image-wrap">
    <img id="resultImage" alt="Generated AI score image">
  </div>

  <script>
    const optionsEl = document.getElementById("options");
    const scoreEl = document.getElementById("score");
    const generateBtn = document.getElementById("generateBtn");
    const resultImage = document.getElementById("resultImage");

    let checkboxes = [];
    let currentScore = 0;

    function formatScore(value) {
      return Number(value.toFixed(1)).toString();
    }

    function parseCsv(text) {
      const lines = text.split(/\r?\n/).map((line) => line.trim()).filter(Boolean);
      if (lines.length < 2) return [];

      const headers = lines[0].split(",").map((v) => v.trim().toLowerCase());
      const typeIndex = headers.indexOf("type");
      const coeffIndex = headers.indexOf("coefficient");
      if (typeIndex === -1 || coeffIndex === -1) return [];

      const items = [];
      for (let i = 1; i < lines.length; i += 1) {
        const cols = lines[i].split(",").map((v) => v.trim());
        const type = cols[typeIndex];
        const coefficientRaw = cols[coeffIndex] || "";
        const coefficient = Number.parseFloat(coefficientRaw.replace(",", "."));
        if (!type || Number.isNaN(coefficient)) continue;
        items.push({ type, coefficient });
      }
      return items;
    }

    function renderOptions(items) {
      optionsEl.innerHTML = "";
      items.forEach((item) => {
        const label = document.createElement("label");
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "item";
        checkbox.dataset.coefficient = String(item.coefficient);
        checkbox.addEventListener("change", updateScore);
        label.append(checkbox, ` ${item.type}`);
        optionsEl.append(label);
      });
      checkboxes = Array.from(document.querySelectorAll(".item"));
    }

    async function loadOptionsFromCsv() {
      try {
        const response = await fetch("./checkboxes.csv");
        if (!response.ok) throw new Error("CSV loading failed");
        const csvText = await response.text();
        const items = parseCsv(csvText);
        if (items.length === 0) throw new Error("CSV format is invalid");
        renderOptions(items);
      } catch (error) {
        optionsEl.textContent = "Failed to load checkboxes.csv";
        checkboxes = [];
      }
      updateScore();
    }

    function updateScore() {
      let score = 0;
      checkboxes.forEach((checkbox) => {
        if (!checkbox.checked) return;
        const coefficient = Number.parseFloat(checkbox.dataset.coefficient || "0");
        if (Number.isNaN(coefficient)) return;
        score += coefficient;
      });

      currentScore = score * 10;

      scoreEl.textContent = formatScore(currentScore);
    }

    function generateImage() {
      const canvas = document.createElement("canvas");
      canvas.width = 280;
      canvas.height = 90;
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#000000";
      ctx.lineWidth = 4;
      ctx.strokeRect(2, 2, canvas.width - 4, canvas.height - 4);

      let text = "";
      if (Math.abs(currentScore) < 0.000001) {
        text = "NOAI";
      } else if (Math.abs(currentScore - 10) < 0.000001) {
        text = "ALLAI";
      } else {
        text = `${formatScore(currentScore)}AI`;
      }

      ctx.fillStyle = "#000000";
      const fontSize = Math.floor(canvas.height * 0.55);
      ctx.font = `bold ${fontSize}px Arial`;
      ctx.textAlign = "center";
      ctx.textBaseline = "alphabetic";
      const metrics = ctx.measureText(text);
      const textHeight = metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent;
      const y = (canvas.height + textHeight) / 2 - metrics.actualBoundingBoxDescent;
      ctx.fillText(text, canvas.width / 2, y);

      resultImage.src = canvas.toDataURL("image/png");
    }

    generateBtn.addEventListener("click", generateImage);
    loadOptionsFromCsv();
  </script>
</body>
</html>
